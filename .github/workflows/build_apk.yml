name: Gerar OMNIX Estudio APK
on:
  push:
    paths:
      - 'OMNIX_Estudio_APK/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: OMNIX_Estudio_APK
        run: gradle assembleDebug
      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: OMNIX_Estudio_APK
          path: OMNIX_Estudio_APK/app/build/outputs/apk/debug/app-debug.apk
