name: Gerar OMNIX Estudio APK
on:
  push:
    paths:
      - 'OMNIX_Estudio_APK/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Configurar SDK 34 e Licencas
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: OMNIX_Estudio_APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: OMNIX_Estudio_APK
          path: OMNIX_Estudio_APK/app/build/outputs/apk/debug/app-debug.apk